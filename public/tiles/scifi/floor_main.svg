              <rect x="0" y="0" width="32" height="1" fill="#1b2a50"/>
              <rect x="0" y="0" width="1" height="32" fill="#1b2a50"/>
              <rect x="0" y="31" width="32" height="1" fill="#090e1c"/>
              <rect x="31" y="0" width="1" height="32" fill="#090e1c"/>
