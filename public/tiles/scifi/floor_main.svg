              <!-- Corner Rivets / Hex Bolts -->
              <rect x="3" y="3" width="2" height="2" fill="#0a1020"/>
              <rect x="3" y="3" width="1" height="1" fill="#223668"/>
              <rect x="27" y="3" width="2" height="2" fill="#0a1020"/>
              <rect x="27" y="3" width="1" height="1" fill="#223668"/>
              <rect x="3" y="27" width="2" height="2" fill="#0a1020"/>
